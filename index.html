const shuffle = a => [...a].sort(() => Math.random() - 0.5);
const $ = id => document.getElementById(id);

// ---------- Apni lines: bina repeat ke, har visitor ko alag order ----------
const ownQueue = {};
function nextOwn() {
  const k = cat + "|" + lang;
  if (!ownQueue[k] || ownQueue[k].length < 4) ownQueue[k] = shuffle(REVIEWS[cat][lang]);
  return ownQueue[k].splice(0, 4);
}

// ---------- AI: peeche se taiyar rakhna (kam requests) ----------
const aiCache = {};     // taiyar AI reviews  ("games|hn" -> [4 lines])
const aiPending = {};   // jo abhi ban rahe hain
const turn = {};        // "ai" ya "own": agli baari kiski? (shuru me AI)
let aiFails = 0;
let aiCount = 0;

function prefetch(cats, l) {
  if (!AI_ON || aiFails >= 2 || aiCount >= MAX_AI) return;
  const need = cats.filter(c => !aiCache[c + "|" + l] && !aiPending[c + "|" + l]);
  if (!need.length) return;
  need.forEach(c => { aiPending[c + "|" + l] = true; });
  aiCount++;
  fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ cats: need, lang: l })
  })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(({ ok, d }) => {
      let got = 0;
      if (ok && d.reviews) {
        need.forEach(c => {
          const arr = d.reviews[c];
          if (Array.isArray(arr) && arr.length >= 2) {
            aiCache[c + "|" + l] = arr.slice(0, 4);
            got++;
          }
        });
      }
      if (got) aiFails = 0; else aiFails++;
    })
    .catch(() => { aiFails++; })
    .finally(() => { need.forEach(c => { aiPending[c + "|" + l] = false; }); });
}

// AI taiyar hone ka thodi der intezaar (maximum WAIT_MS)
function waitFor(k, ms) {
  return new Promise(res => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (aiCache[k] || !aiPending[k] || Date.now() - t0 > ms) {
        clearInterval(iv);
        res();
      }
    }, 120);
  });
}

function setLang(l) {
  lang = l;
  prefetch(CATS.map(c => c.id), lang);   // nayi language ke AI reviews peeche se
  render();
}

function render() {
  const u = UI[lang];
  document.documentElement.lang = lang === "en" ? "en" : "hi";
  $("sub").textContent = u.sub;
  $("hint").textContent = u.hint;
  $("note").textContent = u.note;
  $("moreBtn").textContent = u.more;
  $("ownTitle").textContent = u.ownTitle;
  $("ownBtn").textContent = u.ownBtn;
  document.querySelectorAll(".lang button").forEach(b =>
    b.classList.toggle("on", b.dataset.l === lang));

  const box = $("cats");
  box.innerHTML = "";
  CATS.forEach(c => {
    const b = document.createElement("button");
    b.className = "cat" + (cat === c.id ? " on" : "");
    b.textContent = c[lang];
    b.onclick = () => {
      if (cat === c.id) return;   // wahi category dobara dabane par refresh nahi
      cat = c.id;
      render();
    };
    box.appendChild(b);
  });
  showRevs();
}

async function showRevs() {
  const box = $("revs");
  const show = !!cat;
  $("note").style.display = show ? "block" : "none";
  $("moreBtn").style.display = show ? "block" : "none";
  $("own").style.display = show ? "block" : "none";
  box.innerHTML = "";
  if (!show) return;

  const my = ++reqId;
  const k = cat + "|" + lang;
  let list = null;

  // AI ki baari (shuru me hamesha AI)
  if (turn[k] !== "own") {
    if (!aiCache[k] && aiPending[k]) {
      box.innerHTML = `<p class="loading">${UI[lang].loading}</p>`;
      await waitFor(k, WAIT_MS);
      if (my !== reqId) return;   // customer ne beech me kuch aur dabaya
    }
    if (aiCache[k]) {
      list = aiCache[k];
      delete aiCache[k];
      turn[k] = "own";
    }
  }

  // Apni lines ki baari (ya AI ready nahi tha)
  if (!list) {
    list = nextOwn();
    turn[k] = "ai";
    prefetch([cat], lang);   // jab tak customer ye dekhe, agla AI batch taiyar
  }

  box.innerHTML = "";
  list.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "rev";
    b.style.animationDelay = (i * 0.06) + "s";
    b.textContent = text;
    b.onclick = () => go(text, b);
    box.appendChild(b);
  });
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
}

async function go(text, el) {
  if (busy) return;
  text = (text || "").trim();
  if (!text) return alert(UI[lang].empty);
  busy = true;
  if (el) el.classList.add("done");
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = $("custom");
    ta.value = text; ta.select(); document.execCommand("copy");
  }
  toast(UI[lang].copied);
  setTimeout(() => {
    location.href = "https://search.google.com/local/writereview?placeid=" + PLACE_ID;
    setTimeout(() => {
      busy = false;
      $("toast").classList.remove("show");
      if (el) el.classList.remove("done");
    }, 1500);
  }, 1000);
}

// Page khulte hi: teeno categories ke AI reviews ek hi request me peeche se
prefetch(CATS.map(c => c.id), lang);
render();
</script>
